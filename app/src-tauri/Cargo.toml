[package]
name = "productivity-proxy-app"
version = "0.1.0"
description = "ProductivityProxy desktop app"
authors = ["ProductivityProxy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "productivity_proxy_app"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
