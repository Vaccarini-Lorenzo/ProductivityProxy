# Tests for ProductivityProxy: Python engine + React frontend.
#
# Rust/Tauri is intentionally NOT built here: it has no `#[test]` targets yet, and
# compiling the Tauri shell needs heavy webkit system dependencies. Add a job when
# Rust tests exist.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  POLICY_MAX_STEPS: "1000"
  PRODUCTIVE_PROXY_TELEMETRY_VERBOSE: "false"
  PRODUCTIVE_PROXY_EVENT_LOG_MAX_BYTES: "5000000"
  PRODUCTIVE_PROXY_EVENT_QUEUE_MAX_ITEMS: "1000"
  PRODUCTIVE_PROXY_ASYNC_QUEUE_MAX_ITEMS: "100"
  PRODUCTIVE_PROXY_STREAM_LARGE_BODIES: "1m"
  PRODUCTIVE_PROXY_STATE_FLUSH_SECONDS: "2"

jobs:
  python:
    name: Python engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s test -t . -p 'test_*.py'

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/react/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
