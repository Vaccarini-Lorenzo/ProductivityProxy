# CI for ProductivityProxy.
#
# Rust/Tauri is intentionally NOT built here: it has no `#[test]` targets yet, and
# compiling the Tauri shell needs heavy webkit system dependencies. Add a job when
# Rust tests exist.
#
# The benchmark publishes its latency to an orphan `badges` branch (no secrets,
# uses the built-in GITHUB_TOKEN) so the README badge can show the current number.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  POLICY_MAX_STEPS: "1000"
  PRODUCTIVE_PROXY_TELEMETRY_VERBOSE: "false"
  PRODUCTIVE_PROXY_EVENT_LOG_MAX_BYTES: "5000000"
  PRODUCTIVE_PROXY_STATE_FLUSH_SECONDS: "2"

jobs:
  python:
    name: Python engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s test -t . -p 'test_*.py'

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/react/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  benchmark:
    name: Engine benchmark
    runs-on: ubuntu-latest
    needs: python
    permissions:
      contents: write # publish the latency badge to the `badges` branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run benchmark
        id: bench
        run: |
          ./scripts/run_bench.sh | tee bench.out
          echo "summary=$(sed -n 's/^bench-json //p' bench.out)" >> "$GITHUB_OUTPUT"
      - name: Publish latency badge
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          SUMMARY: ${{ steps.bench.outputs.summary }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          label=$(printf '%s' "$SUMMARY" | python3 -c "import json,sys;print(json.load(sys.stdin)['latency_label'])")
          work=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"latency","message":"%s","color":"blue"}\n' "$label" > "$work/pp-latency.json"
          cd "$work"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pp-latency.json
          git commit -q -m "bench: update latency badge [skip ci]"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
