# Latency benchmark for ProductivityProxy's policy engine.
#
# On push to main it commits the measured latency to assets/pp-latency.json
# (loop-guarded with [skip ci]) so the README badge shows the current number
# with no extra branch. It runs independently of the test suite.

name: Latency benchmark

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  POLICY_MAX_STEPS: "1000"
  PRODUCTIVE_PROXY_TELEMETRY_VERBOSE: "false"
  PRODUCTIVE_PROXY_EVENT_LOG_MAX_BYTES: "5000000"
  PRODUCTIVE_PROXY_STATE_FLUSH_SECONDS: "2"

jobs:
  benchmark:
    name: Engine benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the latency badge file to assets/ on main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run benchmark
        id: bench
        run: |
          ./scripts/run_bench.sh | tee bench.out
          echo "summary=$(sed -n 's/^bench-json //p' bench.out)" >> "$GITHUB_OUTPUT"
      - name: Update latency badge
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          SUMMARY: ${{ steps.bench.outputs.summary }}
        run: |
          label=$(printf '%s' "$SUMMARY" | python3 -c "import json,sys;print(json.load(sys.stdin)['latency_label'])")
          printf '{"schemaVersion":1,"label":"latency","message":"%s","color":"blue"}\n' "$label" > assets/pp-latency.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pp-latency.json
          if git diff --cached --quiet -- assets/pp-latency.json; then
            echo "badge unchanged"
            exit 0
          fi
          git commit -m "chore: update latency badge [skip ci]"
          git push origin HEAD:main
